<script type="module">

function drawMinimap(){
  const w=mini.width/N;
  mctx.clearRect(0,0,mini.width,mini.height);
  for(let z=0;z<N;z++)for(let x=0;x<N;x++){
    if(map[z][x]=="#"){
      mctx.fillStyle="#d1b84f";
      mctx.fillRect(x*w,z*w,w,w);
    }else{
      mctx.fillStyle="#222";
      mctx.fillRect(x*w,z*w,w,w);
    }
    if(map[z][x]=="E"){
      mctx.fillStyle="#00dd66";
      mctx.fillRect(x*w+2,z*w+2,w-4,w-4);
    }
  }
  // Anahtarları göster

      const x=k.position.x/2, z=k.position.z/2;
      mctx.fillStyle="#ffd700";
      mctx.fillRect(x*w+w*.3,z*w+w*.3,w*.4,w*.4);

  if(monster){

}

const wallMat=new THREE.MeshStandardMaterial({color:0xc9b458,roughness:1}),walls=[];
let start,exitPos,keyMeshes=[];function cell(x,z){return new THREE.Vector3(x*S,1.25,z*S)}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(N*S,N*S),new THREE.MeshStandardMaterial({color:0x8f8750}));floor.rotation.x=-Math.PI/2;floor.position.set(14,0,14);scene.add(floor);
for(let z=0;z<N;z++)for(let x=0;x<N;x++){let c=map[z][x],p=cell(x,z);if(c=="#"){let w=new THREE.Mesh(new THREE.BoxGeometry(S,2.5,S),wallMat);w.position.copy(p);scene.add(w);walls.push(w)}if(c=="P")start=new THREE.Vector3(x*S,1.1,z*S);if(c=="E")exitPos=new THREE.Vector3(x*S,1,z*S);if(c=="K"){let k=new THREE.Mesh(new THREE.TorusGeometry(.28,.09,10,20),new THREE.MeshStandardMaterial({color:0xffd700,emissive:0x886600}));k.position.set(x*S,.8,z*S);k.rotation.x=Math.PI/2;scene.add(k);keyMeshes.push(k)}}
const exit=new THREE.Mesh(new THREE.BoxGeometry(.3,2,.3),new THREE.MeshStandardMaterial({color:0x00ff66,emissive:0x006622}));exit.position.copy(exitPos);scene.add(exit);
// Detaylı tek gözlü, turkuaz tüylü, büyük ağızlı canavar

// Güçlü iki bacak
for(const side of [-1,1]){
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(.32,.48,1.45,12),fur);
  leg.position.set(side*.45,.95,0); monster.add(leg);

  const foot=new THREE.Mesh(new THREE.SphereGeometry(.42,14,10),furDark);
  foot.scale.set(1,.55,1.5); foot.position.set(side*.45,.2,.25); monster.add(foot);

  for(let c=-1;c<=1;c++){
    const toe=new THREE.Mesh(new THREE.ConeGeometry(.08,.42,8),pink);
    toe.position.set(side*.45+c*.13,.08,.68);

  }
}

// Tüylü görünüm için gövde ve kollara küçük çıkıntılar
for(let i=0;i<32;i++){
  const a=i*2.399;
  const y=1.5+(i%8)*.32;
  const r=.85;
  const tuft=new THREE.Mesh(new THREE.ConeGeometry(.055,.25,5),furDark);
  tuft.position.set(Math.cos(a)*r,y,Math.sin(a)*.5);
  tuft.rotation.z=a;

monster.position.set(25,0,25);
monster.scale.set(.78,.78,.78);
scene.add(monster);

camera.position.copy(start);let yaw=0,pitch=0,joy={x:0,y:0},running=false,collected=0,over=false,run=false;
let heardNoise=false,noiseTimer=0,noisePosition=new THREE.Vector3(),lastStepTime=0,jumpDone=false;

// 🎵 Oyun müziği ve canavar yaklaşma gerilimi
let audioCtx=null, masterGain=null, musicGain=null, tensionGain=null;
let musicTimer=null, tensionTimer=null;

function initAudio(){
  if(audioCtx) { if(audioCtx.state==="suspended") audioCtx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  audioCtx=new AC();

  masterGain=audioCtx.createGain();
  masterGain.gain.value=.32;
  masterGain.connect(audioCtx.destination);

  musicGain=audioCtx.createGain();
  musicGain.gain.value=.18;
  musicGain.connect(masterGain);

  tensionGain=audioCtx.createGain();
  tensionGain.gain.value=0;
  tensionGain.connect(masterGain);

  // Karanlık, oyun melodisi: düşük sesli tekrar eden synth notaları
  const notes=[55,65.41,73.42,65.41,49,58.27,65.41,58.27];
  let i=0;
  musicTimer=setInterval(()=>{
    if(!audioCtx||!running||over) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="triangle";
    o.frequency.value=notes[i++%notes.length];
    g.gain.setValueAtTime(.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.045,audioCtx.currentTime+.04);
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.75);
    o.connect(g); g.connect(musicGain);
    o.start(); o.stop(audioCtx.currentTime+.8);
  },620);

  // Gerilim sesi: canavar yaklaştıkça titreşimli düşük ton
  tensionTimer=setInterval(()=>{
    if(!audioCtx||!running||over) return;
    const dist=monster.position.distanceTo(camera.position);
    const danger=Math.max(0,Math.min(1,(14-dist)/14));
    const target=danger*danger*.22;
    tensionGain.gain.setTargetAtTime(target,audioCtx.currentTime,.08);
    if(danger>.03){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sawtooth";
      o.frequency.value=48+danger*28;
      g.gain.setValueAtTime(.0001,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.025*danger+.001,audioCtx.currentTime+.04);
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.25);
      o.connect(g); g.connect(tensionGain);
      o.start(); o.stop(audioCtx.currentTime+.27);
    }
  },260);
}

function stopAudio(){
  if(musicTimer) clearInterval(musicTimer);
  if(tensionTimer) clearInterval(tensionTimer);
  musicTimer=tensionTimer=null;
  if(audioCtx){try{audioCtx.close()}catch(e){}}
  audioCtx=null;
}

function jumpscare(){if(jumpDone)return;jumpDone=true;const j=document.getElementById("jumpscare"),f=j.firstElementChild;j.style.display="flex";f.classList.add("shake");const AC=window.AudioContext||window.webkitAudioContext;if(AC){const a=new AC(),o=a.createOscillator(),g=a.createGain();o.type="sawtooth";o.frequency.setValueAtTime(180,a.currentTime);o.frequency.exponentialRampToValueAtTime(45,a.currentTime+.65);g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.8,a.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.8);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.85)}setTimeout(()=>{j.style.display="none";f.classList.remove("shake")},900)}
// Canavarın bütün ulaşılabilir koridorları dolaşması için tam harita devriye rotası
function buildPatrolPath(){
  const startX=Math.round(monster.position.x/S), startZ=Math.round(monster.position.z/S);
  const visited=new Set(), path=[];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  const key=(x,z)=>x+','+z;
  function dfs(x,z){
    const k=key(x,z);
    if(x<0||z<0||x>=N||z>=N||map[z][x]=='#'||visited.has(k)) return;
    visited.add(k);
    path.push(new THREE.Vector3(x*S,0,z*S));
    const shuffled=dirs.slice().sort(()=>Math.random()-.5);
    for(const [dx,dz] of shuffled){
      const nx=x+dx,nz=z+dz;
      if(nx>=0&&nz>=0&&nx<N&&nz<N&&map[nz][nx]!='#'&&!visited.has(key(nx,nz))){
        dfs(nx,nz);
        // Geri dönüşü de ekle: canavar her koridoru tarayarak başlangıca geri döner.
        path.push(new THREE.Vector3(x*S,0,z*S));
      }
    }
  }
  dfs(startX,startZ);
  return path;
}
const patrolPoints=buildPatrolPath();
let patrolIndex=0;

function collide(p){
  const r=.22;
  const samples=[[0,0],[r,0],[-r,0],[0,r],[0,-r]];
  return samples.some(([sx,sz])=>{const x=Math.round((p.x+sx)/S),z=Math.round((p.z+sz)/S);return x<0||z<0||x>=N||z>=N||map[z][x]=="#"});
}
function cellOf(pos){return {x:Math.round(pos.x/S),z:Math.round(pos.z/S)}}
function canSeePlayer(){
  const a=cellOf(monster.position), b=cellOf(camera.position);
  let x=a.x,z=a.z,dx=Math.abs(b.x-a.x),dz=Math.abs(b.z-a.z),sx=a.x<b.x?1:-1,sz=a.z<b.z?1:-1,err=dx-dz;
  while(true){
    if(x<0||z<0||x>=N||z>=N||map[z][x]=="#") return false;
    if(x===b.x&&z===b.z) return true;
    const e2=2*err; if(e2>-dz){err-=dz;x+=sx} if(e2<dx){err+=dx;z+=sz}
  }
}
function nextStepToward(from,to){
  const a=cellOf(from), b=cellOf(to);
  const q=[[a.x,a.z]], prev=new Map([[a.x+","+a.z,null]]);
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(q.length){const [x,z]=q.shift(); if(x===b.x&&z===b.z) break;
    for(const [dx,dz] of dirs){const nx=x+dx,nz=z+dz,k=nx+","+nz;
      if(nx<0||nz<0||nx>=N||nz>=N||map[nz][nx]=="#"||prev.has(k)) continue;
      prev.set(k,[x,z]);q.push([nx,nz]);
    }
  }
  const targetKey=b.x+","+b.z; if(!prev.has(targetKey)) return null;
  let cur=[b.x,b.z], parent=prev.get(targetKey);
  while(parent && !(parent[0]===a.x&&parent[1]===a.z)){cur=parent;parent=prev.get(cur[0]+","+cur[1])}
  return new THREE.Vector3(cur[0]*S,0,cur[1]*S);
}
function finish(win){over=true;running=false;stopAudio();document.getElementById("msg").style.display="flex";document.getElementById("msg").innerHTML=win?"🎉 KAÇTIN!<br><small>Labirentten başarıyla çıktın!</small><button onclick='location.reload()'>TEKRAR OYNA</button>":"💀 CANAVAR YAKALADI!<button onclick='location.reload()'>TEKRAR DENE</button>"}

};
const J=document.getElementById("joy"),ST=document.getElementById("stick");let jt=null;
J.addEventListener("pointerdown",e=>{jt=e.pointerId;J.setPointerCapture(jt);moveJoy(e)});J.addEventListener("pointermove",e=>{if(e.pointerId==jt)moveJoy(e)});J.addEventListener("pointerup",e=>{jt=null;joy={x:0,y:0};ST.style.left="32px";ST.style.top="32px"});
function moveJoy(e){let r=J.getBoundingClientRect(),x=e.clientX-r.left-60,y=e.clientY-r.top-60,d=Math.hypot(x,y),m=Math.min(d,45);if(d){x=x/d*m;y=y/d*m}joy={x:x/45,y:y/45};ST.style.left=32+x+"px";ST.style.top=32+y+"px"}
let lt=null,lx;const L=document.getElementById("look");L.addEventListener("pointerdown",e=>{lt=e.pointerId;lx=e.clientX;L.setPointerCapture(lt)});L.addEventListener("pointermove",e=>{if(e.pointerId==lt){yaw-=(e.clientX-lx)*.008;camera.rotation.set(0,yaw,0);lx=e.clientX}});L.addEventListener("pointerup",e=>lt=null);
const R=document.getElementById("run");R.addEventListener("pointerdown",()=>run=true);R.addEventListener("pointerup",()=>run=false);R.addEventListener("pointerleave",()=>run=false);
function loop(){requestAnimationFrame(loop);if(running&&!over){let d=new THREE.Vector3(joy.x,0,joy.y);if(d.length()>.1){d.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);let np=camera.position.clone().addScaledVector(d,run?.25:.14);if(!collide(np))camera.position.copy(np);
if(run&&performance.now()-lastStepTime>350&&monster.position.distanceTo(camera.position)<16){lastStepTime=performance.now();heardNoise=true;noiseTimer=220;noisePosition.copy(camera.position);}}
lamp.position.copy(camera.position);
keyMeshes.forEach(k=>{if(k.visible){k.rotation.z+=.05;if(k.position.distanceTo(camera.position)<1){k.visible=false;collected++;if(collected==3)document.getElementById("status").textContent="🚪 ÇIKIŞ AÇILDI!"}}});
// Canavar normalde haritada devriye gezer, seni yakında görünce kovalar
let c=camera.position.clone().sub(monster.position);c.y=0;
let distance=c.length();

if(distance<18 && c.length() && canSeePlayer()){
  const step=nextStepToward(monster.position,camera.position);
  if(step){let dir=step.clone().sub(monster.position);dir.y=0; if(dir.length()>.02){dir.normalize();let np=monster.position.clone().addScaledVector(dir,.075);if(!collide(np))monster.position.copy(np);else monster.position.copy(step)}}
  
}else if(heardNoise&&noiseTimer>0){
  let ndir=noisePosition.clone().sub(monster.position);ndir.y=0;
  if(ndir.length()>.7){ndir.normalize();let np=monster.position.clone().addScaledVector(ndir,.045);if(!collide(np))monster.position.copy(np);}else heardNoise=false;
  noiseTimer--;
}else{
  heardNoise=false;let target=patrolPoints[patrolIndex];let pdir=target.clone().sub(monster.position);pdir.y=0;
  if(pdir.length()<.5)patrolIndex=(patrolIndex+1)%patrolPoints.length;
  else{pdir.normalize();let np=monster.position.clone().addScaledVector(pdir,.038);if(!collide(np))monster.position.copy(np);}
  
}

if(monster.position.distanceTo(camera.position)<1.4){jumpscare();setTimeout(()=>finish(false),850);}if(collected==3&&camera.position.distanceTo(exitPos)<1.4)finish(true)}
// Canavarın yürürken hafif sallanması
monster.rotation.z=Math.sin(performance.now()*.006)*.035;
monster.position.y=Math.abs(Math.sin(performance.now()*.008))*.06;
renderer.render(scene,camera)}loop();addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
